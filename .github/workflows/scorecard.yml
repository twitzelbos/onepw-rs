# OpenSSF Scorecard: rates the repo's security practices (branch protection, pinned actions,
# token permissions, signed releases, …). Results go to the Security tab and to the public
# Scorecard API, which serves the README badge.
name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to the Security tab
      id-token: write # publish the results (needed for the badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0 (v2.6.0 pins an image digest missing from ghcr.io)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
