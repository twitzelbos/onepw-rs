name: Fuzz
# Runs every fuzz target in fuzz/ for a few minutes: weekly, and on demand.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [secret_key, secret_reference, server_response, keysets, jwk, srp_server_value, item_fields]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=8192
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
