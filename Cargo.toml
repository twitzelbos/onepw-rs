[package]
name = "onepw"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "Unofficial pure-Rust client for 1Password accounts (SRP sign-in, vault and item decryption). Not affiliated with 1Password."
license = "MIT OR Apache-2.0"
repository = "https://github.com/twitzelbos/onepw-rs"
readme = "README.md"
keywords = ["1password", "password-manager", "srp", "secrets"]
categories = ["cryptography", "api-bindings", "authentication"]
exclude = ["/.github", "/CLAUDE.md", "/fuzz", "/deny.toml"]

[package.metadata.docs.rs]
all-features = true
# Also document the macOS build, which is the only one with `onepw::touchid`.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23"
clap = { version = "4.6.9", features = ["derive"], optional = true }
dirs = { version = "7.0.0", optional = true }
hkdf = "0.13"
hmac = "0.13"
keyring = { version = "3.6.3", features = ["apple-native", "linux-native", "sync-secret-service", "crypto-rust"], optional = true }
num-bigint-dig = { version = "0.9.1", default-features = false, features = ["u64_digit", "zeroize"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rpassword = { version = "7.5.5", optional = true }
rsa = { version = "0.10.0", features = ["sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process"], optional = true }
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.2", features = ["derive"] }
crypto-bigint = { version = "0.7.11", default-features = false, features = ["zeroize"] }

[target.'cfg(unix)'.dependencies]
# mlock / madvise for key memory (src/locked.rs) and setrlimit in the CLI.
libc = "0.2"

[dev-dependencies]
base64 = "0.23"
hex = "0.4.3"
num-bigint-dig = { version = "0.9.1", default-features = false, features = ["u64_digit"] }
rand = "0.10.3"
rpassword = "7.5.5"
rsa = { version = "0.10.0", features = ["sha1"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
zeroize = "1.9.2"

[features]
## The `onepw` command-line tool: `cargo install onepw --features cli`
cli = ["dep:clap", "dep:rpassword", "dep:tokio", "dep:keyring", "dep:dirs", "touchid"]
## macOS ONLY: unlock with Touch ID instead of the password (`onepw::touchid`).
## On other platforms this feature compiles to nothing and pulls in no dependencies.
touchid = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-local-authentication",
    "dep:block2",
    "dep:security-framework",
]
objc2-local-authentication = ["dep:objc2-local-authentication"]
objc2 = ["dep:objc2"]
objc2-foundation = ["dep:objc2-foundation"]
block2 = ["dep:block2"]
security-framework = ["dep:security-framework"]

[[bin]]
name = "onepw"
path = "src/bin/onepw.rs"
required-features = ["cli"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", optional = true, default-features = false, features = ["std", "block2", "LAContext"] }
security-framework = { version = "3.7.0", optional = true, features = ["OSX_10_15"] }

[lints.rust]
# `cfg(fuzzing)` is set by cargo-fuzz (fuzz/); `cfg(docsrs)` by docs.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(docsrs)"] }
