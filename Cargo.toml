[package]
name = "onepw"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
num-bigint-dig = { version = "0.8", features = ["zeroize", "rand"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rsa = { version = "0.9", features = ["sha2"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
hex = "0.4.3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
