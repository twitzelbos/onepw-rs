[package]
name = "onepw-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
onepw = { path = ".." }
serde_json = "1.0.154"

# Not part of the parent package's workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "secret_key"
path = "fuzz_targets/secret_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_reference"
path = "fuzz_targets/secret_reference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_response"
path = "fuzz_targets/server_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keysets"
path = "fuzz_targets/keysets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwk"
path = "fuzz_targets/jwk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "srp_server_value"
path = "fuzz_targets/srp_server_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_fields"
path = "fuzz_targets/item_fields.rs"
test = false
doc = false
bench = false
